# Blueprint para una demo académica en Render.
# Las contraseñas y claves son generadas por Render, nunca se guardan en Git.
services:
  - type: web
    name: sigo-dental-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: sigo-dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.onrender.com

  - type: web
    name: sigo-dental-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sigo-dental-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sigo-dental-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: sigodental
    user: sigo
    ipAllowList: []
