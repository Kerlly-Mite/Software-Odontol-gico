services:
  db:
    image: postgres:16-alpine
    container_name: sigo-dental-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigodental}
      POSTGRES_USER: ${POSTGRES_USER:-sigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigo_local_dev_only}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sigo_postgres_data:/var/lib/postgresql/data
      - ./backend/database/001_fases_1_2.sql:/docker-entrypoint-initdb.d/001_fases_1_2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigo} -d ${POSTGRES_DB:-sigodental}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigo-dental-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sigo}:${POSTGRES_PASSWORD:-sigo_local_dev_only}@db:5432/${POSTGRES_DB:-sigodental}?sslmode=disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-sigo-local-dev-jwt-secret-change-before-production-2026}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-sigo-local-dev-mfa-encryption-key-change-before-production}
      CLINICAL_SIGNING_KEY: ${CLINICAL_SIGNING_KEY:-sigo-local-dev-clinical-signing-key-change-before-production}
      CLINICAL_NOTE_LOCK_HOURS: ${CLINICAL_NOTE_LOCK_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigo-dental-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - sigo_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  sigo_postgres_data:
  sigo_node_modules:
